<!doctype html>
<meta charset="utf-8">
<title>Reflected class and ID reads</title>
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
<body>
<script>
test(() => {
  const engine = NW.Dom;
  const resolver = engine.compile('.item', false);
  for (const className of ['item', { baseVal: 'item' }]) {
    assert_true(resolver({ className, getAttribute() { throw Error('Unnecessary attribute read'); } }, undefined, undefined, false));
  }
  assert_true(resolver({ getAttribute(name) { assert_equals(name, 'class'); return 'item'; } }, undefined, undefined, false));
  for (const namespace of ['http://www.w3.org/1999/xhtml', 'http://www.w3.org/2000/svg']) {
    const target = document.createElementNS(namespace, namespace.endsWith('svg') ? 'g' : 'p');
    target.setAttribute('class', 'item');
    assert_true(engine.match('.item', target));
    target.setAttribute('class', 'other');
    assert_false(engine.match('.item', target));
    for (const id of ['a.b', 'a$b', 'a"b', 'a\\b', '🦄']) {
      target.id = id;
      const selector = '#' + CSS.escape(id);
      assert_true(engine.match(selector, target), selector);
      target.id += 'suffix';
      assert_false(engine.match(selector, target), selector);
    }
  }
}, 'Property reads preserve HTML and SVG classes, attribute fallbacks, and escaped IDs');
</script>
