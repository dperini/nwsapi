ut:optional. 9.97μs</title><text x="48" y="317" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 312h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="311" width="319.81" height="2" fill="url(#series0)"/><text x="940" y="317" class="time" style="font-weight:700">9.97<tspan class="unit">μs</tspan></text></g><g><title>@asamuzakjp/dom-selector v8.3.2: input:optional. 65.82μs</title><text x="48" y="343" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 338h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="337" width="450.94" height="2" fill="url(#series1)"/><text x="940" y="343" class="time">65.82<tspan class="unit">μs</tspan></text></g><text x="48" y="394" class="code selector">input:read-write</text><g><title>nwsapi v2.3.0-prerelease: input:read-write. 63.21μs</title><text x="48" y="427" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 422h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="421" width="448.13" height="2" fill="url(#series0)"/><text x="940" y="427" class="time" style="font-weight:700">63.21<tspan class="unit">μs</tspan></text></g><g><title>@asamuzakjp/dom-selector v8.3.2: input:read-write. 72.01μs</title><text x="48" y="453" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 448h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="447" width="457.18" height="2" fill="url(#series1)"/><text x="940" y="453" class="time">72.01<tspan class="unit">μs</tspan></text></g><text x="48" y="504" class="code selector">button:disabled</text><g><title>nwsapi v2.3.0-prerelease: button:disabled. 36.73μs</title><text x="48" y="537" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 532h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="531" width="410.4" height="2" fill="url(#series0)"/><text x="940" y="537" class="time" style="font-weight:700">36.73<tspan class="unit">μs</tspan></text></g><g><title>@asamuzakjp/dom-selector v8.3.2: button:disabled. 85.28μs</title><text x="48" y="563" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 558h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="557" width="468.94" height="2" fill="url(#series1)"/><text x="940" y="563" class="time">85.28<tspan class="unit">μs</tspan></text></g><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted">Cold queries run a selector first on a fresh document. Warm queries repeat it.</text><text x="1052" y="676" text-anchor="end" class="muted note metadata">Component fixture · Chromium 151.0.7922.34 · direct library APIs<tspan fill="#75808e"> · 2026-09-09 · e1c41a36</tspan></text></svg>
