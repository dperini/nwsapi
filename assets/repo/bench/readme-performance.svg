<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="830" viewBox="0 0 1100 830" role="img" aria-labelledby="title desc"><title id="title">NWSAPI first-match performance</title><desc id="desc">Recorded nonempty first-match queries are 1.6 to 8.2 times faster using nwsapi directly than jsdom querySelector with @asamuzakjp/dom-selector. Each bar starts at zero; white ticks mark the jsdom baseline of one. See linked methodology.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="bar"><stop stop-color="#38cfae"/><stop offset="1" stop-color="#c0f767"/></linearGradient><radialGradient id="glow"><stop stop-color="#77e5a4" stop-opacity=".12"/><stop offset="1" stop-color="#77e5a4" stop-opacity="0"/></radialGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font-size:17px}
.eyebrow{fill:#a8ee8b;font-size:15px;font-weight:700;letter-spacing:3px}
.code,.selector{font-family:Consolas,Menlo,monospace;font-size:18px;fill:#dce6f1}
.ratio{font-size:23px;font-weight:700;fill:#baf471}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 750ms cubic-bezier(.22,1,.36,1) 1 both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="830" rx="24" fill="url(#bg)"/><ellipse cx="920" cy="70" rx="360" ry="220" fill="url(#glow)"/><rect x=".5" y=".5" width="1099" height="829" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="48" class="eyebrow">PERFORMANCE</text><text x="48" y="102" font-size="42" font-weight="700" letter-spacing="-1">Fast CSS Selectors API Engine</text><text x="48" y="183" font-size="66" font-weight="800" letter-spacing="-3" fill="#baf471" style="fill:#baf471">1.6–8.2×</text><text x="407" y="165" font-size="25" font-weight="700">faster first matches</text><text x="407" y="193" class="muted">Recorded warm-query comparison</text><rect x="48" y="216" width="100" height="32" rx="6" fill="#223048"/><text x="64" y="238" class="code">nwsapi</text><text x="163" y="238" class="muted">vs</text><rect x="199" y="216" width="317" height="32" rx="6" fill="#223048"/><text x="213" y="238" class="code">@asamuzakjp/dom-selector</text><path d="M48 273h1004" stroke="#304159"/><text x="48" y="304" class="muted">First-match speedup · Longer is faster</text><path d="M788 288v20" stroke="#e4eaf2" stroke-width="2"/><text x="802" y="304" class="muted"><tspan class="code">jsdom</tspan> baseline = 1×</text><text x="48" y="330" class="selector">.card</text><text x="508" y="330" text-anchor="end" class="ratio">3.8×</text><rect x="48" y="343" width="404" height="12" rx="6" fill="#223048"/><rect x="48" y="343" width="171.97" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:0ms"/><path d="M92.89 338v22" stroke="#e4eaf2" stroke-width="2"/><text x="48" y="399" class="selector">button</text><text x="508" y="399" text-anchor="end" class="ratio">5.2×</text><rect x="48" y="412" width="404" height="12" rx="6" fill="#223048"/><rect x="48" y="412" width="232.68" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:70ms"/><path d="M92.89 407v22" stroke="#e4eaf2" stroke-width="2"/><text x="4