 height="12" rx="6" fill="#223048"/><rect x="584" y="412" width="186.92" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:70ms"/><path d="M628.89 407v22" stroke="#e4eaf2" stroke-width="2"/><text x="584" y="468" class="selector">div:nth-child(2n)</text><text x="1044" y="468" text-anchor="end" class="ratio">3.4×</text><rect x="584" y="481" width="404" height="12" rx="6" fill="#223048"/><rect x="584" y="481" width="154.75" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:140ms"/><path d="M628.89 476v22" stroke="#e4eaf2" stroke-width="2"/><text x="584" y="537" class="selector">input, button</text><text x="1044" y="537" text-anchor="end" class="ratio">4.9×</text><rect x="584" y="550" width="404" height="12" rx="6" fill="#223048"/><rect x="584" y="550" width="221.03" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:210ms"/><path d="M628.89 545v22" stroke="#e4eaf2" stroke-width="2"/><text x="584" y="606" class="selector">:is(button, input)</text><text x="1044" y="606" text-anchor="end" class="ratio">1.6×</text><rect x="584" y="619" width="404" height="12" rx="6" fill="#223048"/><rect x="584" y="619" width="70.68" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:280ms"/><path d="M628.89 614v22" stroke="#e4eaf2" stroke-width="2"/><text x="584" y="675" class="selector">button:not(.missing)</text><text x="1044" y="675" text-anchor="end" class="ratio">6.3×</text><rect x="584" y="688" width="404" height="12" rx="6" fill="#223048"/><rect x="584" y="688" width="281.57" height="12" rx="6" fill="url(#bar)" class="bar" style="animation-delay:350ms"/><path d="M628.89 683v22" stroke="#e4eaf2" stroke-width="2"/><path d="M48 737h1004" stroke="#304159"/><text x="48" y="766" class="muted"><tspan class="code">nwsapi</tspan> 2.3.0-prerelease · <tspan class="code">@asamuzakjp/dom-selector</tspan> 8.3.2 · <tspan class="code">jsdom</tspan> 30.0.1</text><text x="48" y="791" class="muted">Direct engine API vs 