<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Browser file size</title><desc>NWSAPI core browser file versus the full comparison library bundle, including its runtime dependencies. Same Rolldown minifier · Gzip level 9 · Brotli quality 11 · No jsdom or tree shaking Excludes the NWSAPI CLI, jsdom adapter and optional css-tree peer. This is a file size report, not timing. Lower is better. Each group has its own zero-based linear scale.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.engine{font-size:16px}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" style="font-size:24px;font-weight:700">Browser file size</text><text x="48" y="90" class="muted">Standalone libraries · Lower is better · Each group starts at zero</text><text x="48" y="155" class="code" style="font-weight:600">Minified JavaScript</text><g><title>NWSAPI: 54.09KiB</title><text x="48" y="192" class="code engine">NWSAPI</text><path d="M410 187h490" stroke="#223048" stroke-width="2"/><rect x="410" y="183" width="87.618" height="8" rx="4" fill="#baf471"/><text x="930" y="192" class="muted">54.09KiB</text></g><g><title>@asamuzakjp/dom-selector: 302.48KiB</title><text x="48" y="224" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 219h490" stroke="#223048" stroke-width="2"/><rect x="410" y="215" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="224" class="muted">302.48KiB</text></g><text x="48" y="295" class="code" style="font-weight:600">Gzip</text><g><title>NWSAPI: 18.65KiB</title><text x="48" y="332" class="code engine">NWSAPI</text><path d="M410 327h490" stroke="#223048" stroke-width="2"/><rect x="410" y="323" width="103.905" height="8" rx="4" fill="#baf471"/><text x="930" y="332" class="muted">18.65KiB</text></g><g><title>@asamuzakjp/dom-selector: 87.97KiB</title><text x="48" y="364" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 359h490" stroke="#223048" stroke-width="2"/><rect x="410" y="355" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="364" class="muted">87.97KiB</text></g><text x="48" y="435" class="code" style="font-weight:600">Brotli</text><g><title>NWSAPI: 16.83KiB</title><text x="48" y="472" class="code engine">NWSAPI</text><path d="M410 467h490" stroke="#223048" stroke-width="2"/><rect x="410" y="463" width="106.473" height="8" rx="4" fill="#baf471"/><text x="930" y="472" class="muted">16.83KiB</text></g><g><title>@asamuzakjp/dom-selector: 77.46KiB</title><text x="48" y="504" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 499h490" stroke="#223048" stroke-width="2"/><rect x="410" y="495" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="504" class="muted">77.46KiB</text></g><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">NWSAPI core browser file versus the full comparison library bundle, including its runtime dependencies.</text><text x="48" y="644" class="muted note metadata">Same Rolldown minifier · Gzip level 9 · Brotli quality 11 · No jsdom or tree shaking</text><text x="48" y="672" class="muted note metadata">Excludes the NWSAPI CLI, jsdom adapter and optional css-tree peer. This is a file size report, not timing.</text></svg>
