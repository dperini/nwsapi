<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>File size</title><desc>NWSAPI core browser file versus the full comparison library bundle, including its runtime dependencies. Same Rolldown minifier · Gzip level 9 · Brotli quality 11 · No jsdom or tree shaking Excludes the NWSAPI CLI, jsdom adapter and optional css-tree peer. This is a file size report, not timing. Lower is better. Each group has its own zero-based linear scale.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient><linearGradient id="series2"><stop stop-color="#80d7ff"/><stop offset="1" stop-color="#739be8"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
