 width="661.097" height="2" fill="url(#series0)"/><circle cx="170.006" cy="484" r="3" fill="#baf471"/><circle cx="831.103" cy="484" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: input.input. Cold 51.88μs; warm 1.04μs.</title><path d="M48 504h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="387.767" y="503" width="568.839" height="2" fill="url(#series1)"/><circle cx="387.767" cy="504" r="3" fill="#a4aff7"/><circle cx="956.606" cy="504" r="3" fill="#ef9bc9"/></g><text x="48" y="532" class="comparison"><tspan dx="0">Cold 2.37<tspan class="unit">×</tspan> faster</tspan><tspan dx="20">Warm 4.47<tspan class="unit">×</tspan> faster</tspan></text><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">Cold: first query on a fresh engine/document. Warm: repeated query. Setup excluded.</text><text x="1052" y="652" text-anchor="end" class="muted note metadata">Direct first() / querySelector() · Chromium 151.0.7922.34 · Apple M3 Max</text><text x="1052" y="676" text-anchor="end" class="muted note metadata"><tspan class="package">nwsapi</tspan> v2.3.0-prerelease · <tspan class="package">@asamuzakjp/dom-selector</tspan> v8.3.2 · No jsdom</text></svg>
