.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.selector,.tick,.comparison{font-size:16px}.selector{font-weight:600}.comparison{fill:#c5d4e5}.bar{animation:fade 750ms ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" class="chart-title">First matches</text><text x="48" y="90" class="muted">Logarithmic scale · Further left is faster</text><text x="540" y="58" class="code" style="fill:#baf471">● nwsapi</text><text x="540" y="90" class="code" style="fill:#a4aff7">● @asamuzakjp/dom-selector</text><text x="48" y="146" class="tick" text-anchor="start">0.1<tspan class="unit">μs</tspan></text><text x="299" y="146" class="tick" text-anchor="middle">1<tspan class="unit">μs</tspan></text><text x="550" y="146" class="tick" text-anchor="middle">10<tspan class="unit">μs</tspan></text><text x="801" y="146" class="tick" text-anchor="middle">100<tspan class="unit">μs</tspan></text><text x="1052" y="146" class="tick" text-anchor="end">1<tspan class="unit">ms</tspan></text><text x="48" y="186" class="code selector">input.input</text><g><title>nwsapi: input.input. Cold 26.87μs; warm 0.32μs.</title><path d="M48 208h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="173.098" y="207" width="484.669" height="2" fill="url(#series0)"/><circle cx="173.098" cy="208" r="3" fill="#baf471"/><circle cx="657.766" cy="208" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: input.input. Cold 62.50μs; warm 1.14μs.</title><path d="M48 228h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="313.554" y="227" width="436.211" height="2" fill="url(#series1)"/><circle cx="313.554" cy="228" r="3" fill="#a4aff7"/><circle cx="749.766" cy="228" r="3" fill="#ef9bc9"/></g><text x="48" y="256" class="comparison"><tspan dx="0">Cold 2.33<tspan class="unit">×</tspan> faster</tspan><tspan dx="20">Warm