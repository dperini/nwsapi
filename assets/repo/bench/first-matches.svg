<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Cold and warm first matches</title><desc>Direct standalone library calls on native browser DOMs, without jsdom. Each line connects warm and cold times on the same logarithmic scale. Further left is faster.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient><linearGradient id="series2"><stop stop-color="#80d7ff"/><stop offset="1" stop-color="#739be8"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e;font-size:14px}
.chart-title{font-size:24px;font-weight:700}
.unit{fill:#75808e}
.package{font-family:Consolas,Menlo,monospace}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.selector,.tick,.comparison{font-size:16px}.selector{font-weight:600}.comparison{fill:#c5d4e5}.bar{animation:fade 750ms ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" class="chart-title">First matches</text><text x="48" y="90" class="muted">Logarithmic scale · Further left is faster</text><text x="540" y="58" class="code" style="fill:#baf471">● nwsapi</text><text x="540" y="90" class="code" style="fill:#a4aff7">● @asamuzakjp/dom-selector</text><text x="48" y="146" class="tick" text-anchor="start">0.1<tspan class="unit">μs</tspan></text><text x="299" y="146" class="tick" text-anchor="middle">1<tspan class="unit">μs</tspan></text><text x="550" y="146" class="tick" text-anchor="middle">10<tspan class="unit">μs</tspan></text><text x="801" y="146" class="tick" text-anchor="middle">100<tspan class="unit">μs</tspan></text><text x="1052" y="146" class="tick" text-anchor="end">1<tspan class="unit">ms</tspan></text><text x="48" y="186" class="code selector">input.input</text><g><title>nwsapi: input.input. Cold 27.50μs; warm 0.28μs.</title><path d="M48 208h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="161.668" y="207" width="498.605" height="2" fill="url(#series0)"/><circle cx="161.668" cy="208" r="3" fill="#baf471"/><circle cx="660.273" cy="208" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: input.input. Cold 54.38μs; warm 1.06μs.</title><path d="M48 228h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="305.341" y="227" width="429.244" height="2" fill="url(#series1)"/><circle cx="305.341" cy="228" r="3" fill="#a4aff7"/><circle cx="734.585" cy="228" r="3" fill="#ef9bc9"/></g><text x="48" y="256" class="comparison"><tspan dx="0">Cold 1.98<tspan class="unit">×</tspan> faster</tspan><tspan dx="20">Warm