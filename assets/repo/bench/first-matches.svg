<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Cold and warm first matches</title><desc>Direct standalone library calls on native browser DOMs, without jsdom. Each line connects warm and cold times on the same logarithmic scale. Further left is faster.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient><linearGradient id="series2"><stop stop-color="#80d7ff"/><stop offset="1" stop-color="#739be8"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e;font-size:14px}
.chart-title{font-size:24px;font-weight:700}
.unit{fill:#75808e}
.package{font-family:Consolas,Menlo,monospace}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.selector,.tick,.comparison{font-size:16px}.selector{font-weight:600}.comparison{fill:#c5d4e5}.bar{animation:fade 750ms ease-out both}@keyframes fade{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" class="chart-title">First matches</text><text x="48" y="90" class="muted">Logarithmic scale · Further left is faster</text><text x="540" y="58" class="code" style="fill:#baf471">● nwsapi</text><text x="540" y="90" class="code" style="fill:#a4aff7">● @asamuzakjp/dom-selector</text><text x="48" y="146" class="tick" text-anchor="start">0.1<tspan class="unit">μs</tspan></text><text x="299" y="146" class="tick" text-anchor="middle">1<tspan class="unit">μs</tspan></text><text x="550" y="146" class="tick" text-anchor="middle">10<tspan class="unit">μs</tspan></text><text x="801" y="146" class="tick" text-anchor="middle">100<tspan class="unit">μs</tspan></text><text x="1052" y="146" class="tick" text-anchor="end">1<tspan class="unit">ms</tspan></text><text x="48" y="186" class="code selector">[data-testid]</text><g><title>nwsapi: [data-testid]. Cold 164.37μs; warm 0.53μs.</title><path d="M48 208h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="230.241" y="207" width="624.934" height="2" fill="url(#series0)"/><circle cx="230.241" cy="208" r="3" fill="#baf471"/><circle cx="855.175" cy="208" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: [data-testid]. Cold 52.50μs; warm 2.02μs.</title><path d="M48 228h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="375.83" y="227" width="354.93" height="2" fill="url(#series1)"/><circle cx="375.83" cy="228" r="3" fill="#a4aff7"/><circle cx="730.76" cy="228" r="3" fill="#ef9bc9"/></g><text x="48" y="256" class="comparison"><tspan dx="0">Cold 3.13<tspan class="unit">×</tspan> slower</tspan><tspan dx="20">Warm 3.80<tspan class="unit">×</tspan> faster</tspan></text><text x="48" y="286" class="code selector">input, button</text><g><title>nwsapi: input, button. Cold 193.13μs; warm 0.58μs.</title><path d="M48 308h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="239.437" y="307" width="633.309" height="2" fill="url(#series0)"/><circle cx="239.437" cy="308" r="3" fill="#baf471"/><circle cx="872.745" cy="308" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: input, button. Cold 53.13μs; warm 2.07μs.</title><path d="M48 328h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="378.193" y="327" width="353.857" height="2" fill="url(#series1)"/><circle cx="378.193" cy="328" r="3" fill="#a4aff7"/><circle cx="732.05" cy="328" r="3" fill="#ef9bc9"/></g><text x="48" y="356" class="comparison"><tspan dx="0">Cold 3.64<tspan class="unit">×</tspan> slower</tspan><tspan dx="20">Warm 3.57<tspan class="unit">×</tspan> faster</tspan></text><text x="48" y="386" class="code selector">input.input</text><g><title>nwsapi: input.input. Cold 23.75μs; warm 0.28μs.</title><path d="M48 408h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="160.923" y="407" width="483.368" height="2" fill="url(#series0)"/><circle cx="160.923" cy="408" r="3" fill="#baf471"/><circle cx="644.292" cy="408" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: input.input. Cold 51.88μs; warm 0.97μs.</title><path d="M48 428h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="295.127" y="427" width="434.327" height="2" fill="url(#series1)"/><circle cx="295.127" cy="428" r="3" fill="#a4aff7"/><circle cx="729.454" cy="428" r="3" fill="#ef9bc9"/></g><text x="48" y="456" class="comparison"><tspan dx="0">Cold 2.18<tspan class="unit">×</tspan> faster</tspan><tspan dx="20">Warm 3.43<tspan class="unit">×</tspan> faster</tspan></text><text x="48" y="486" class="code selector">.card &gt; button.primary</text><g><title>nwsapi: .card &gt; button.primary. Cold 37.50μs; warm 0.29μs.</title><path d="M48 508h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="162.34" y="507" width="531.742" height="2" fill="url(#series0)"/><circle cx="162.34" cy="508" r="3" fill="#baf471"/><circle cx="694.082" cy="508" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: .card &gt; button.primary. Cold 51.88μs; warm 0.89μs.</title><path d="M48 528h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="285.866" y="527" width="443.588" height="2" fill="url(#series1)"/><circle cx="285.866" cy="528" r="3" fill="#a4aff7"/><circle cx="729.454" cy="528" r="3" fill="#ef9bc9"/></g><text x="48" y="556" class="comparison"><tspan dx="0">Cold 1.38<tspan class="unit">×</tspan> faster</tspan><tspan dx="20">Warm 3.11<tspan class="unit">×</tspan> faster</tspan></text><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">Cold: first query on a fresh engine/document. Warm: repeated query. Setup excluded.</text><text x="1052" y="668" text-anchor="end" class="muted note metadata">Direct first() / querySelector() · Chromium 154.0.8037.0 · Apple M3 Max</text><text x="1052" y="692" text-anchor="end" class="muted note metadata"><tspan class="package">nwsapi</tspan> v2.3.0-prerelease · <tspan class="package">@asamuzakjp/dom-selector</tspan> v9.1.1 · No jsdom</text></svg>
