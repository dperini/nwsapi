-width="2"/><rect class="bar" x="183.579" y="507" width="703.678" height="2" fill="url(#series0)"/><circle cx="183.579" cy="508" r="3" fill="#baf471"/><circle cx="887.257" cy="508" r="3" fill="#2bc5ae"/></g><g><title>@asamuzakjp/dom-selector: button. Cold 55.00μs; warm 1.05μs.</title><path d="M48 528h1004" stroke="#223048" stroke-width="2"/><rect class="bar" x="304.373" y="527" width="431.458" height="2" fill="url(#series1)"/><circle cx="304.373" cy="528" r="3" fill="#a4aff7"/><circle cx="735.831" cy="528" r="3" fill="#ef9bc9"/></g><text x="48" y="556" class="comparison"><tspan dx="0">Cold 4.01<tspan class="unit">×</tspan> slower</tspan><tspan dx="20">Warm 3.03<tspan class="unit">×</tspan> faster</tspan></text><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">Cold: first query on a fresh engine/document. Warm: repeated query. Setup excluded.</text><text x="1052" y="668" text-anchor="end" class="muted note metadata">Direct first() / querySelector() · Chromium 154.0.8037.0 · Apple M1 Max</text><text x="1052" y="692" text-anchor="end" class="muted note metadata"><tspan class="package">nwsapi</tspan> v2.3.0-prerelease · <tspan class="package">@asamuzakjp/dom-selector</tspan> v9.2.4 · No jsdom</text></svg>
