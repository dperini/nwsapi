<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Basic selectors</title><desc>Component fixture · Chromium 151.0.7922.34 · direct library APIs. Median query time on a shared logarithmic scale; further left is faster. Bars span from the lowest labeled time to each value. Failed correctness checks have no bar.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e;font-size:14px}
.chart-title{font-size:24px;font-weight:700}
.unit{fill:#75808e}
.package{font-family:Consolas,Menlo,monospace}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.engine{font-size:16px}.selector{font-weight:600}.tick{font-size:14px}.bar{transform-box:fill-box;transform-origin:left center;animation:fill 800ms ease-out both}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" class="chart-title">Basic selectors</text><text x="48" y="90" class="muted">Logarithmic time scale · Shorter bars are faster</text><text x="1052" y="90" text-anchor="end" class="muted">Warm queries · All results</text><text x="440" y="146" text-anchor="start" class="tick">0.01<tspan class="unit">μs</tspan></text><text x="536" y="146" text-anchor="middle" class="tick">0.1<tspan class="unit">μs</tspan></text><text x="632" y="146" text-anchor="middle" class="tick">1<tspan class="unit">μs</tspan></text><text x="728" y="146" text-anchor="middle" class="tick">10<tspan class="unit">μs</tspan></text><text x="824" y="146" text-anchor="middle" class="tick">100<tspan class="unit">μs</tspan></text><text x="920" y="146" text-anchor="end" class="tick">1<tspan class="unit">ms</tspan></text><text x="48" y="174" class="code selector">#in-150</text><g><title>nwsapi v2.3.0-prerelease: #in-150. 0.24μs</title><text x="48" y="207" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 202h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="201" width="133.34" height="2" fill="url(#series0)"/><text x="940" y="207" class="time" style="font-weight:700">0.24<tspan class="unit">μs</tspan></text></g><g><title>@asamuzakjp/dom-selector v9.1.1: #in-150. 0.14ms</title><text x="48" y="233" class="code engine">@asamuzakjp/dom-selector v9.1.1</text><path d="M440 228h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="227" width="396.97" height="2" fill="url(#series1)"/><text x="940" y="2