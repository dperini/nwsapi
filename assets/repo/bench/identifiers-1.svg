<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Basic selectors</title><desc>Component fixture · Chromium 151.0.7922.34 · direct library APIs. Median milliseconds per query; lower is better. Failed correctness checks have no timing.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.engine{font-size:16px}.selector{font-weight:600}.bar{transform-box:fill-box;transform-origin:left center;animation:fill 800ms ease-out 1 both}@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){.bar{animation:none}}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="65" class="muted">Linear time scale</text><text x="48" y="89" class="muted">Shorter bars are faster</text><text x="440" y="89" class="muted">Warm queries · All results</text><text x="48" y="150" class="code selector">#in-150</text><g><title>nwsapi v2.3.0-prerelease: #in-150. 0.24μs</title><text x="48" y="183" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 178h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="177" width=".69" height="2" fill="url(#series0)"/><text x="940" y="183" class="time" style="font-weight:700">0.24μs</text></g><g><title>@asamuzakjp/dom-selector v8.3.2: #in-150. 0.17ms</title><text x="48" y="209" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 204h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="203" width="480" height="2" fill="url(#series1)"/><text x="940" y="209" class="time">0.17ms</text></g><text x="48" y="260" class="code selector">.card</text><g><title>nwsapi v2.3.0-prerelease: .card. 0.27μs</title><text x="48" y="293" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 288h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="287" width=".8" height="2" fill="url(#series0)"/><text x="940" y="293" class="time" style="font-weight:700">0.27μs</text></g><g><title>@asamuzakjp/dom-selector v8.3.2: .card. 11.82μs</title><text x="48" y="319" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 314h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="313" width="34.36" height="2" fill="url(#series1)"/><text x="940" y="319" class="time">11.82μs</text></g><text x="48" y="370" class="code selector">button</text><g><title>nwsapi v2.3.0-prerelease: button. 0.26μs</title><text x="48" y="403" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 398h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="397" width=".77" height="2" fill="url(#series0)"/><text x="940" y="403" class="time" style="font-weight:700">0.26μs</text></g><g><title>@asamuzakjp/dom-selector v8.3.2: button. 12.19μs</title><text x="48" y="429" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 424h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="423" width="35.43" height="2" fill="url(#series1)"/><text x="940" y="429" class="time">12.19μs</text></g><text x="48" y="480" class="code selector">button.primary</text><g><title>nwsapi v2.3.0-prerelease: button.primary. 4.75μs</title><text x="48" y="513" class="code engine" style="font-weight:700">nwsapi v2.3.0-prerelease</text><path d="M440 508h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="507" width="13.82" height="2" fill="url(#series0)"/><text x="940" y="513" class="time" style="font-weight:700">4.75μs</text></g><g><title>@asamuzakjp/dom-selector v8.3.2: button.primary. 59.13μs</title><text x="48" y="539" class="code engine">@asamuzakjp/dom-selector v8.3.2</text><path d="M440 534h480" stroke="#223048" stroke-width="2"/><rect class="bar" x="440" y="533" width="171.88" height="2" fill="url(#series1)"/><text x="940" y="539" class="time">59.13μs</text></g><path d="M48 602h1004" stroke="#304159"/><text x="48" y="640" class="muted">Cold queries run a selector first on a fresh document. Warm queries repeat it.</text><text x="48" y="675" class="muted note metadata">Component fixture · Chromium 151.0.7922.34 · direct library APIs<tspan fill="#75808e"> · 2026-09-08 · 4bd6955d</tspan></te