<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="773" viewBox="0 0 1100 773" role="img" aria-labelledby="title desc"><title id="title">nwsapi</title><desc id="desc">Warm and cold first-query times for nwsapi and @asamuzakjp/dom-selector through jsdom. Both engine columns use the same logarithmic time scale. Each gradient connects warm and cold markers. Further left means faster. Exact timings appear below each line. Cold measurements exclude document creation and explicit NWSAPI factory setup.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font-size:16px}
.code{font-family:Consolas,Menlo,monospace;font-size:18px;fill:#dce6f1}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 750ms cubic-bezier(.22,1,.36,1) 1 both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
