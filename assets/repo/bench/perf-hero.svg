)" style="animation-delay:385ms"/><circle cx="537.179" cy="879" r="3" fill="#a4aff7"/><circle cx="878.375" cy="879" r="3" fill="#ef9bc9"/></g><path d="M48 938h1004" stroke="#304159"/><text x="48" y="976" class="muted">Queries model component trees, Tailwind-style classes, and Testing Library test IDs.</text><text x="48" y="999" class="muted">Warm queries repeat a selector. Cold queries run it first on a fresh document.</text><text x="48" y="1022" class="muted">Warm speedups were 1.8–7.1×. Cold results vary. Both engines use the same logarithmic scale.</text><text x="48" y="1045" class="muted"><tspan class="code">nwsapi</tspan> 2.3.0-prerelease · <tspan class="code">@asamuzakjp/dom-selector</tspan> 8.3.2 · <tspan class="code">jsdom</tspan> 30.0.1</text><text x="48" y="1068" class="muted">Direct engine API vs <tspan class="code">jsdom</tspan> querySelector · Node.js 26.5.0 · Apple M3 Max</text></svg>
