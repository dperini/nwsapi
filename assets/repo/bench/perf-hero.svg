cx="537.105" cy="879" r="3" fill="#a4aff7"/><circle cx="878.479" cy="879" r="3" fill="#ef9bc9"/></g><path d="M48 938h1004" stroke="#304159"/><text x="48" y="976" class="muted note">Queries model React/Next.js components, Tailwind-style classes, and Testing Library test IDs.</text><text x="48" y="999" class="muted note">Cold queries run a selector first on a fresh document. Warm queries repeat it.</text><text x="48" y="1022" class="muted note">Cold speedups were 1.3–13.8×. Warm speedups were 1.8–12.9×.</text><text x="48" y="1057" class="muted note metadata"><tspan class="code">nwsapi</tspan> v2.3.0-prerelease · <tspan class="code">@asamuzakjp/dom-selector</tspan> v8.3.2 · <tspan class="code">jsdom</tspan> v30.0.1</text><text x="48" y="1080" class="muted note metadata">Direct engine API <tspan class="code">first()</tspan> vs <tspan class="code">jsdom</tspan> <tspan class="code">querySelector()</tspan> · Node.js v26.5.0 · Apple M3 Max</text></svg>
