<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Memory footprint</title><desc>Retained JavaScript heap per engine after garbage collection. Native DOM allocation is excluded. Chromium 151.0.7922.34 · 40 engines per sample · Median of 5 rounds · No jsdom Both libraries are loaded before the baseline. Raw samples and methodology: docs/benchmarks.md. Lower is better. Each group has its own zero-based linear scale.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.engine{font-size:16px}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" style="font-size:24px;font-weight:700">Memory footprint</text><text x="48" y="90" class="muted">Standalone libraries · Lower is better · Each group starts at zero</text><text x="48" y="155" class="code" style="font-weight:600">Initialized engine</text><g><title>NWSAPI: 11.72KiB</title><text x="48" y="192" class="code engine">NWSAPI</text><path d="M410 187h490" stroke="#223048" stroke-width="2"/><rect x="410" y="183" width="17.401" height="8" rx="4" fill="#baf471"/><text x="930" y="192" class="muted">11.72KiB</text></g><g><title>@asamuzakjp/dom-selector: 330.09KiB</title><text x="48" y="224" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 219h490" stroke="#223048" stroke-width="2"/><rect x="410" y="215" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="224" class="muted">330.09KiB</text></g><text x="48" y="295" class="code" style="font-weight:600">Engine after 100 distinct queries</text><g><title>NWSAPI: 86.79KiB</title><text x="48" y="332" class="code engine">NWSAPI</text><path d="M410 327h490" stroke="#223048" stroke-width="2"/><rect x="410" y="323" width="77.276" height="8" rx="4" fill="#baf471"/><text x="930" y="332" class="muted">86.79KiB</text></g><g><title>@asamuzakjp/dom-selector: 550.32KiB</title><text x="48" y="364" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 359h490" stroke="#223048" stroke-width="2"/><rect x="410" y="355" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="364" class="muted">550.32KiB</text></g><text x="48" y="435" class="code" style="font-weight:600">Additional retained heap from queries</text><g><title>NWSAPI: 75.07KiB</title><text x="48" y="472" class="code engine">NWSAPI</text><path d="M410 467h490" stroke="#223048" stroke-width="2"/><rect x="410" y="463" width="167.021" height="8" rx="4" fill="#baf471"/><text x="930" y="472" class="muted">75.07KiB</text></g><g><title>@asamuzakjp/dom-selector: 220.23KiB</title><text x="48" y="504" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 499h490" stroke="#223048" stroke-width="2"/><rect x="410" y="495" width="490" height="8" rx="4" fill="#a4aff7"/><text x="930" y="504" class="muted">220.23KiB</text></g><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">Retained JavaScript heap per engine after garbage collection. Native DOM allocation is excluded.</text><text x="48" y="644" class="muted note metadata">Chromium 151.0.7922.34 · 40 engines per sample · Median of 5 rounds · No jsdom</text><text x="48" y="672" class="muted note metadata">Both libraries are loaded before the baseline. Raw samples and methodology: docs/benchmarks.md.</text></svg>
