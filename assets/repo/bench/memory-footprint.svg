<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Memory footprint</title><desc>Retained JavaScript heap per engine after garbage collection. Native DOM allocation is excluded. Chromium 151.0.7922.34 · 40 engines per sample · Median of 5 rounds · No jsdom Both libraries are loaded before the baseline. Raw samples and methodology: docs/benchmarks.md. Lower is better. Each group has its own zero-based linear scale.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><linearGradient id="series0"><stop stop-color="#baf471"/><stop offset="1" stop-color="#2bc5ae"/></linearGradient><linearGradient id="series1"><stop stop-color="#a4aff7"/><stop offset="1" stop-color="#ef9bc9"/></linearGradient><linearGradient id="series2"><stop stop-color="#80d7ff"/><stop offset="1" stop-color="#739be8"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#f0f5fa}
.muted{fill:#aabbd0;font:16px Arial,Helvetica,sans-serif}
.code{font:18px Consolas,Menlo,monospace;fill:#dce6f1}
.note .code{font:16px Consolas,Menlo,monospace}
.metadata,.metadata .code{fill:#75808e;font-size:14px}
.chart-title{font-size:24px;font-weight:700}
.unit{fill:#75808e}
.package{font-family:Consolas,Menlo,monospace}
.comparison{font-size:14px;font-variant-numeric:tabular-nums}
.tick{fill:#aabbd0;font-size:12px}
.time{fill:#aabbd0;font-size:13px;font-variant-numeric:tabular-nums}
.engine{font-size:16px}</style><rect width="1100" height="720" rx="24" fill="url(#bg)"/><rect x=".5" y=".5" width="1099" height="719" rx="24" fill="none" stroke="#2b3a50"/><text x="48" y="58" class="chart-title">Memory footprint</text><text x="48" y="90" class="muted">Standalone libraries · Lower is better · Each group starts at zero</text><text x="48" y="155" class="code" style="font-weight:600">Initialized engine</text><g><title>nwsapi: 11.72KiB</title><text x="48" y="192" class="code engine">nwsapi</text><path d="M410 187h490" stroke="#223048" stroke-width="2"/><rect x="410" y="186" width="17.401" height="2" fill="url(#series0)"/><text x="930" y="192" class="muted">11.72<tspan class="unit">KiB</tspan></text></g><g><title>@asamuzakjp/dom-selector: 330.09KiB</title><text x="48" y="224" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 219h490" stroke="#223048" stroke-width="2"/><rect x="410" y="218" width="490" height="2" fill="url(#series1)"/><text x="930" y="224" class="muted">330.09<tspan class="unit">KiB</tspan></text></g><text x="48" y="295" class="code" style="font-weight:600">Engine after 100 distinct queries</text><g><title>nwsapi: 86.80KiB</title><text x="48" y="332" class="code engine">nwsapi</text><path d="M410 327h490" stroke="#223048" stroke-width="2"/><rect x="410" y="326" width="77.29" height="2" fill="url(#series0)"/><text x="930" y="332" class="muted">86.80<tspan class="unit">KiB</tspan></text></g><g><title>@asamuzakjp/dom-selector: 550.30KiB</title><text x="48" y="364" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 359h490" stroke="#223048" stroke-width="2"/><rect x="410" y="358" width="490" height="2" fill="url(#series1)"/><text x="930" y="364" class="muted">550.30<tspan class="unit">KiB</tspan></text></g><text x="48" y="435" class="code" style="font-weight:600">Additional retained heap from queries</text><g><title>nwsapi: 75.08KiB</title><text x="48" y="472" class="code engine">nwsapi</text><path d="M410 467h490" stroke="#223048" stroke-width="2"/><rect x="410" y="466" width="167.064" height="2" fill="url(#series0)"/><text x="930" y="472" class="muted">75.08<tspan class="unit">KiB</tspan></text></g><g><title>@asamuzakjp/dom-selector: 220.21KiB</title><text x="48" y="504" class="code engine">@asamuzakjp/dom-selector</text><path d="M410 499h490" stroke="#223048" stroke-width="2"/><rect x="410" y="498" width="490" height="2" fill="url(#series1)"/><text x="930" y="504" class="muted">220.21<tspan class="unit">KiB</tspan></text></g><path d="M48 582h1004" stroke="#304159"/><text x="48" y="616" class="muted note">Retained JavaScript heap per engine after garbage collection. Native DOM allocation is excluded.</text><text x="1052" y="652" text-anchor="end" class="muted note metadata">Chromium 151.0.7922.34 · 40 engines per sample · Median of 5 rounds · No jsdom</text><text x="1052" y="676" text-anchor="end" class="muted note metadata">Both libraries are loaded before the baseline. Raw samples and methodology: docs/benchmarks.md.</text></svg>
