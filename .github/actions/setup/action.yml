name: Setup
description: Install Node and nwsapi contributor dependencies. The package manager choice lives here so both workflows share one definition.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    # Read pinned versions while preserving the workflow's Node test matrix.
    - run: |
        NWSAPI_NODE_VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('.config/external-tools.json', 'utf8')).tools.node.version)")
        NWSAPI_NPM_VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('.config/external-tools.json', 'utf8')).tools.npm.version)")
        echo "node-version=$NWSAPI_NODE_VERSION" >> "$GITHUB_OUTPUT"
        echo "npm-version=$NWSAPI_NPM_VERSION" >> "$GITHUB_OUTPUT"
      id: pinned-tools
      shell: bash
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.pinned-tools.outputs.node-version }}
    # Install using the pinned Node runtime so dependencies may require it.
    - run: |
        NWSAPI_NPM_VERSION=${{ steps.pinned-tools.outputs.npm-version }}
        npm install --global "npm@$NWSAPI_NPM_VERSION" --ignore-scripts
      shell: bash
    - run: npm ci
      shell: bash
    # Keep tests on the requested matrix runtime after dependency setup.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    # Restore the pinned npm executable for commands under the matrix runtime.
    - run: |
        NWSAPI_NPM_VERSION=${{ steps.pinned-tools.outputs.npm-version }}
        npm install --global "npm@$NWSAPI_NPM_VERSION" --ignore-scripts
      shell: bash
