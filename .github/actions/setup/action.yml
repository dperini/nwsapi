name: Setup
description: Install Node and nwsapi contributor dependencies. The package manager choice lives here so both workflows share one definition.

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    # Read the npm pin while preserving the workflow's Node test matrix.
    - run: |
        NWSAPI_NPM_VERSION=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('.config/external-tools.json', 'utf8')).tools.npm.version)")
        npm install --global "npm@$NWSAPI_NPM_VERSION" --ignore-scripts
      shell: bash
    - run: npm ci
      shell: bash
