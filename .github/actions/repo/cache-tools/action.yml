name: Cache tools and pnpm store
description: Restore verified tool downloads and the pnpm content-addressed store.

runs:
  using: composite
  steps:
    - name: Restore tool and package caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/external-tools
          .cache/nub
          .cache/pnpm-store
        key: nwsapi-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.config/external-tools.json') }}
        restore-keys: |
          nwsapi-v1-${{ runner.os }}-${{ runner.arch }}-
