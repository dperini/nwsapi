name: 'ci: gates'
run-name: 'ci: gates'

on:
  push:
    branches: [prerelease/3.0.0]
  pull_request:
    branches: [prerelease/3.0.0]
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      fullNode: ${{ steps.test-plan.outputs.fullNode }}
      unitShards: ${{ steps.test-plan.outputs.unitShards }}
      unitShardCount: ${{ steps.test-plan.outputs.unitShardCount }}
    runs-on: ubuntu-26.04
    env:
      pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm-store
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          # Full ancestry lets the affected-test planner verify its comparison.
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "${TRIGGER_SHA}"
          git checkout -q --detach "${TRIGGER_SHA}"
      - uses: ./.github/actions/repo/cache-tools
      - name: Install integrity-verified contributor tools
        run: node scripts/repo/setup/tools.mts --github-path
      - name: Verify the pinned Mold linker
        shell: bash
        run: |
          mold_path="$(realpath "$(command -v mold)")"
          mold_root="$(dirname "$(dirname "${mold_path}")")"
          export MOLD_LIBDIR="${mold_root}/lib/mold"
          echo "MOLD_LIBDIR=${MOLD_LIBDIR}" >> "${GITHUB_ENV}"
          mold --version
          printf 'int main(void) { return 0; }\n' > "${RUNNER_TEMP}/mold-smoke.c"
          mold -run cc "${RUNNER_TEMP}/mold-smoke.c" -o "${RUNNER_TEMP}/mold-smoke"
          readelf -p .comment "${RUNNER_TEMP}/mold-smoke" | grep -F mold
      # Use real Git for upstream setup, not the local runner's checkout shim.
      - run: PATH="$(git --exec-path):$PATH" pnpm install --frozen-lockfile --prefer-offline
      - name: Check repository code and generated files
        run: pnpm run check
      - name: Audit workflows and agent configuration
        run: pnpm run security
      - name: Plan affected runtime tests
        id: test-plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run test:ci --github-output
      - name: Test affected Node behavior
        if: steps.test-plan.outputs.node == 'true'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run test:ci --integration-only
      - name: Replay the fuzz corpus
        if: steps.test-plan.outputs.fuzz == 'true'
        id: fuzz-replay
        run: pnpm run test:fuzz:replay
      - name: Fuzz changed selector behavior
        if: steps.test-plan.outputs.fuzz == 'true'
        run: pnpm run test:fuzz
        id: fuzz
        env:
          FUZZ_TIME_MS: '15000'
      - name: Test package interoperability on nub-managed Node versions
        if: steps.test-plan.outputs.package == 'true'
        run: pnpm run test:package
      - name: Install Chrome system dependencies
        if: steps.test-plan.outputs.browser == 'true' || steps.test-plan.outputs.upstream == 'true'
        run: |
          # Setup installs pinned Chrome for Testing. A stale system-Chrome index
          # must not block installation of Ubuntu's browser dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm exec playwright install-deps chromium
          pnpm run setup:browser
      - name: Test native browser behavior
        if: steps.test-plan.outputs.browser == 'true'
        run: pnpm run test:browser
      - name: Test upstream WPT selectors
        if: steps.test-plan.outputs.upstream == 'true'
        run: pnpm run test:wpt
      - name: Upload fuzz corpus
        if: always() && steps.test-plan.outputs.fuzz == 'true' && (steps.fuzz.outcome != 'skipped' || steps.fuzz-replay.outcome == 'failure')
        uses: ./.github/actions/repo/upload-artifact
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: .vitiate/
          if-no-files-found: warn
          retention-days: 14

  unit:
    needs: runtime
    if: ${{ !cancelled() && needs.runtime.outputs.fullNode == 'true' }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.runtime.outputs.unitShards) }}
    env:
      pnpm_config_store_dir: ${{ github.workspace }}/.cache/pnpm-store
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          # Full ancestry lets the affected-test planner verify its comparison.
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "${TRIGGER_SHA}"
          git checkout -q --detach "${TRIGGER_SHA}"
      - uses: ./.github/actions/repo/cache-tools
      - name: Install integrity-verified contributor tools
        run: node scripts/repo/setup/tools.mts --github-path
      - run: PATH="$(git --exec-path):$PATH" pnpm install --frozen-lockfile --prefer-offline
      - name: Run unit shard within its normal budget
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.runtime.outputs.unitShardCount }}
        run: >-
          node scripts/repo/test/shard/run.mts
          --index "$SHARD_INDEX" --count "$SHARD_COUNT"
          --directory "$RUNNER_TEMP/unit-reports"
      - name: Upload unit shard diagnostics
        if: always()
        uses: ./.github/actions/repo/upload-artifact
        with:
          name: unit-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/unit-reports
          if-no-files-found: error
          retention-days: 7

  node:
    name: summary
    needs: [runtime, unit]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          # Full ancestry lets the affected-test planner verify its comparison.
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "${TRIGGER_SHA}"
          git checkout -q --detach "${TRIGGER_SHA}"
      - uses: ./.github/actions/repo/cache-tools
        if: needs.runtime.outputs.fullNode == 'true'
      - name: Install integrity-verified contributor tools
        if: needs.runtime.outputs.fullNode == 'true'
        run: node scripts/repo/setup/tools.mts --github-path
      - name: Download every unit shard report
        if: needs.runtime.outputs.fullNode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=5
          while true; do
            rm -rf "$RUNNER_TEMP/unit-reports"
            mkdir -p "$RUNNER_TEMP/unit-reports"
            if gh run download "$GITHUB_RUN_ID" \
              --pattern "unit-shard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-*" \
              --dir "$RUNNER_TEMP/unit-reports" \
              2>"$RUNNER_TEMP/unit-download.err"; then
              break
            else
              status=$?
            fi
            cat "$RUNNER_TEMP/unit-download.err" >&2
            if [ "$attempt" -ge "$max_attempts" ] ||
              ! grep -Eq 'HTTP (429|502|503)' "$RUNNER_TEMP/unit-download.err"; then
              exit "$status"
            fi
            delay=$((attempt * 10))
            echo "Artifact service returned a retryable status. Retrying in ${delay}s (attempt $((attempt + 1))/$max_attempts)."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
      - name: Verify complete unit test inventory
        if: needs.runtime.outputs.fullNode == 'true'
        run: >-
          node scripts/repo/test/shard/verify.mts
          --directory "$RUNNER_TEMP/unit-reports"
      - name: Require all runtime and unit gates
        if: always()
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          FULL_NODE: ${{ needs.runtime.outputs.fullNode }}
        run: |
          test "$RUNTIME_RESULT" = success
          if [ "$FULL_NODE" = true ]; then
            test "$UNIT_RESULT" = success
          else
            test "$UNIT_RESULT" = skipped
          fi

  perf:
    name: 'perf: tak'
    needs: [node, onboarding]
    if: >-
      github.event_name == 'push' && needs.node.result == 'success' &&
      needs.onboarding.result == 'success'
    uses: ./.github/workflows/perf-tak.yml
    permissions:
      contents: write

  onboarding:
    name: 'onboarding (${{ matrix.os }}, ${{ matrix.manager }})'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-26.04"]' || '["ubuntu-26.04","macos-15","windows-2025"]') }}
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Bootstrap from the minimum Node version
        timeout-minutes: 30
        run: node scripts/repo/test/onboarding/ci.mts bootstrap
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '26.11.0'
          package-manager-cache: false
      - name: Provision the entry package manager
        timeout-minutes: 15
        env:
          ENTRY_MANAGER: ${{ matrix.manager }}
        run: node scripts/repo/test/onboarding/ci.mts install-manager
      - name: Install, use the wizard, and complete the developer journey
        timeout-minutes: 60
        env:
          ENTRY_MANAGER: ${{ matrix.manager }}
        run: node scripts/repo/test/onboarding/ci.mts journey
      - name: Upload onboarding diagnostics
        if: always()
        uses: ./.github/actions/repo/upload-artifact
        with:
          name: onboarding-${{ matrix.os }}-${{ matrix.manager }}-${{ github.run_id }}
          path: .cache/onboarding/
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize onboarding journey
        if: always()
        shell: pwsh
        env:
          ENTRY_MANAGER: ${{ matrix.manager }}
          PLATFORM: ${{ matrix.os }}
          JOB_STATUS: ${{ job.status }}
        run: |
          "platform=$env:PLATFORM entry=$env:ENTRY_MANAGER workflow=pnpm status=$env:JOB_STATUS" >> $env:GITHUB_STEP_SUMMARY
          $summaries = @(Get-ChildItem .cache/onboarding/*.summary.json -ErrorAction SilentlyContinue | Sort-Object LastWriteTime)
          if ($summaries.Count -eq 0) {
            'Runner summary unavailable.' >> $env:GITHUB_STEP_SUMMARY
          }
          foreach ($file in $summaries) {
            $summary = Get-Content $file.FullName -Raw | ConvertFrom-Json
            "### $($summary.scenario): $($summary.status)" >> $env:GITHUB_STEP_SUMMARY
            "entry_node=$($summary.entryNodeVersion) commit=$($summary.commit)" >> $env:GITHUB_STEP_SUMMARY
            foreach ($phase in $summary.phases) {
              "- $($phase.status): $($phase.command) (exit $($phase.code))" >> $env:GITHUB_STEP_SUMMARY
            }
          }
