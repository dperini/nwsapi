name: 'ci: gates'
run-name: 'ci: gates'

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  wpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - parallel:
          - name: Install PHP for the WPT server
            uses: ./.github/actions/php
          - name: Verify the pinned WPT checkout
            run: npm run wpt:verify
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run wpt:test
