name: nwsapi
run-name: nwsapi prerelease/3.0.0

on:
  push:
    branches: [prerelease/3.0.0]
  pull_request:
    branches: [prerelease/3.0.0]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
          fi
          # Full ancestry lets the affected-test planner verify its comparison.
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" "${TRIGGER_SHA}"
          git checkout -q --detach "${TRIGGER_SHA}"
      - name: Install integrity-verified contributor tools
        run: node scripts/repo/setup/tools.mts --github-path
      # Use real Git for upstream setup, not the local runner's checkout shim.
      - run: PATH="$(git --exec-path):$PATH" pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Audit workflows and agent configuration
        run: pnpm run security
      - name: Plan affected runtime tests
        id: test-plan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run test:ci --github-output
      - name: Test affected Node behavior
        if: steps.test-plan.outputs.node == 'true'
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: pnpm run test:ci
      - name: Replay the fuzz corpus
        if: steps.test-plan.outputs.fuzz == 'true'
        id: fuzz-replay
        run: pnpm run test:fuzz:replay
      - name: Fuzz changed selector behavior
        if: steps.test-plan.outputs.fuzz == 'true'
        run: pnpm run test:fuzz
        id: fuzz
        env:
          FUZZ_TIME_MS: '15000'
      - uses: ./.github/actions/repo/upload-artifact
        if: always() && steps.test-plan.outputs.fuzz == 'true' && (steps.fuzz.outcome != 'skipped' || steps.fuzz-replay.outcome == 'failure')
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: .vitiate/
          if-no-files-found: warn
          retention-days: 14
      - name: Test package interoperability on nub-managed Node versions
        if: steps.test-plan.outputs.package == 'true'
        run: pnpm run test:package
      - name: Install Chrome system dependencies
        if: steps.test-plan.outputs.browser == 'true'
        run: |
          # Setup installs pinned Chrome for Testing. A stale system-Chrome index
          # must not block installation of Ubuntu's browser dependencies.
          for source in /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources; do
            if [ -f "$source" ]; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          pnpm exec playwright install-deps chromium
          pnpm run setup:browser
      - name: Test native browser behavior
        if: steps.test-plan.outputs.browser == 'true'
        run: pnpm run test:browser
