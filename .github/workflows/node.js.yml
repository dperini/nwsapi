name: nwsapi

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ matrix.node }}'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run min

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run upstream:clone
      - run: npm run upstream:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:upstream
