name: nwsapi

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
      - id: tools
        run: node scripts/repo/external-tools.mts --github-output
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: ${{ steps.tools.outputs.node }}
          package-manager-cache: false
      - run: npm install --global npm@${{ steps.tools.outputs.npm }}
        working-directory: ${{ runner.temp }}
      - run: npm install --global pnpm@${{ steps.tools.outputs.pnpm }}
        working-directory: ${{ runner.temp }}
      # Use real Git for upstream setup, not the local runner's checkout shim.
      - run: PATH="$(git --exec-path):$PATH" pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test:fuzz:replay
        id: fuzz-replay
      - run: pnpm run test:fuzz
        id: fuzz
        env:
          FUZZ_TIME_MS: '15000'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && (steps.fuzz.outcome != 'skipped' || steps.fuzz-replay.outcome == 'failure')
        with:
          name: fuzz-corpus-${{ github.run_id }}
          path: .vitiate/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm run test:package
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run cover
      - run: pnpm run check:coverage
      - run: pnpm run test:browser
      - run: NWSAPI_MINIFIED=1 pnpm run test:wpt
