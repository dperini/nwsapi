name: nwsapi

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (2026-07-14)
        with:
          node-version: '26'
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:package
      - run: npm run upstream:clone
      - run: npm run upstream:verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:upstream
