    <line x1="300" y1="104" x2="300" y2="304" stroke="rgba(255,255,255,0.075)"/>
    <text x="300" y="324" fill="rgba(231,229,242,0.62)" font-size="11" text-anchor="middle">0.01ms</text>
    <line x1="600" y1="104" x2="600" y2="304" stroke="rgba(255,255,255,0.075)"/>
    <text x="600" y="324" fill="rgba(231,229,242,0.62)" font-size="11" text-anchor="middle">0.1ms</text>
    <line x1="900" y1="104" x2="900" y2="304" stroke="rgba(255,255,255,0.075)"/>
    <text x="900" y="324" fill="rgba(231,229,242,0.62)" font-size="11" text-anchor="middle">1ms</text>
    <text x="286" y="135" fill="#e7e5f2" font-size="12.5"
