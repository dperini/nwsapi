[package]
name = "nwsapi-perf-video"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }

[target.'cfg(not(windows))'.dev-dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
fframes_skia_renderer = { version = "=1.2.0", features = ["metal"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["metal", "audio"] }

[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
fframes_skia_renderer = { version = "=1.2.0", features = ["vulkan"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["vulkan", "audio"] }

[lib]
path = "lib.rs"

[[example]]
name = "walkthrough"
path = "walkthrough.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
