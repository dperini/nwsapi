[package]
name = "nwsapi-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.100.1"
publish = false
license = "MIT"
description = "Browser WebAssembly transport for NWSAPI host selector queries"

[lib]
crate-type = ["cdylib"]

[dependencies]
nwsapi = { path = "../dom", default-features = false }
js-sys = "=0.3.81"
wasm-bindgen = "=0.2.104"

[lints]
workspace = true
