[package]
name = "nwsapi-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.100.1"
publish = false
license = "MIT"
description = "Optional Node-API bridge for the native NWSAPI selector engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.8.4", default-features = false, features = ["napi6"] }
napi-derive = "=3.5.3"
nwsapi = { path = "../dom" }
rustc-hash = "2"

[build-dependencies]
napi-build = "=2.3.1"

[lints]
workspace = true
